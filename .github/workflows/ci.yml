name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.0 is the floor composer.json declares; 8.3 and 8.4 are what the
        # estate runs (DDEV and the bedrock-base image respectively).
        php: ['8.0', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: php -l
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: composer validate
        run: composer validate --strict --no-check-lock
  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/structure.sh
